<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美术复审 · 奇美拉纪元</title>
<style>
:root {
  --bg: #15121b;
  --bg-deep: #100d15;
  --panel: #221d2b;
  --panel-2: #2a2435;
  --panel-3: #191520;
  --line: rgba(201, 166, 255, 0.13);
  --line-2: rgba(216, 207, 189, 0.10);
  --text: #d8cfbd;
  --text-hi: #efe7d6;
  --muted: #9a8fa8;
  --muted-2: #6f6680;
  --ok: #6fcf73;
  --ok-ink: #0f2410;
  --bad: #e06a5f;
  --bad-ink: #2b0d0a;
  --accent: #c9a6ff;
  --accent-ink: #1d1230;
  --gold: #e3b866;
  --radius: 14px;
  --top-offset: 0px;
  --toolbar-h: 60px;
  --bar-h: 72px;
  --font: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", "微软雅黑", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC", "WenQuanYi Micro Hei", "WenQuanYi Zen Hei", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, "Noto Sans Mono CJK SC", monospace;
  --checker: repeating-conic-gradient(#3a3346 0% 25%, #2a2433 0% 50%) 0 0 / 18px 18px;
  --checker-lb: repeating-conic-gradient(#8d8796 0% 25%, #6b6575 0% 50%) 0 0 / 24px 24px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { overflow-x: hidden; scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(1100px 520px at 50% -180px, rgba(201, 166, 255, 0.10), transparent 70%),
    radial-gradient(900px 600px at 100% 0, rgba(111, 207, 115, 0.035), transparent 70%),
    var(--bg);
  background-color: var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font: 15px/1.6 var(--font);
  -webkit-font-smoothing: antialiased;
  padding-top: var(--top-offset);
  padding-bottom: calc(var(--bar-h) + 28px);
}
body.is-empty { padding-bottom: 0; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
::selection { background: rgba(201, 166, 255, 0.35); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd {
  display: inline-block; min-width: 1.6em; padding: 0 5px; border-radius: 5px;
  border: 1px solid rgba(216, 207, 189, 0.22); border-bottom-width: 2px;
  background: rgba(255, 255, 255, 0.04); color: var(--text);
  font: 600 11.5px/1.55 var(--mono); text-align: center;
}
.wrap { max-width: 1480px; margin: 0 auto; padding: 0 28px; }

/* ---------- header ---------- */
.hdr { padding: 30px 0 18px; }
.hdr-row { display: flex; gap: 28px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.brand { font-size: 12.5px; letter-spacing: 0.32em; color: var(--muted); margin-bottom: 6px; }
.brand b { color: var(--accent); font-weight: 600; }
h1 {
  margin: 0; font-size: 30px; line-height: 1.25; font-weight: 700; color: var(--text-hi);
  letter-spacing: 0.04em;
}
h1 .dot { color: var(--accent); margin: 0 0.25em; }
h1 .num { color: var(--accent); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 8px; color: var(--muted); font-size: 13.5px; }
.meta span b { color: var(--text); font-weight: 600; }
.meta .money b { color: var(--gold); }
.prog { display: grid; gap: 10px; min-width: 320px; flex: 0 1 420px; }
.prog-row { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: center; font-size: 13px; color: var(--muted); }
.prog-row .nums { color: var(--text); font-variant-numeric: tabular-nums; font-size: 13px; }
.prog-row .nums small { color: var(--muted); font-size: 12px; margin-left: 4px; }
.track { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.06); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03); }
.fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #4d9e52, var(--ok)); width: 0; transition: width .4s ease; }
.fill.p1 { background: linear-gradient(90deg, #a77fe0, var(--accent)); }
.intro {
  margin-top: 20px; display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 16px; border-radius: 12px;
  background: linear-gradient(90deg, rgba(201, 166, 255, 0.09), rgba(201, 166, 255, 0.02));
  border: 1px solid var(--line); color: var(--text); font-size: 14.5px;
}
.intro .ic { color: var(--accent); font-size: 16px; line-height: 1.5; }

/* ---------- toolbar ---------- */
.toolbar {
  position: sticky; top: var(--top-offset); z-index: 20;
  background: rgba(21, 18, 27, 0.88);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line-2);
  margin-bottom: 18px;
}
.toolbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--toolbar-h); flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--panel-3); border: 1px solid var(--line-2); border-radius: 12px; }
.tab {
  border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 9px;
  font-size: 14px; display: inline-flex; gap: 8px; align-items: center; transition: background .15s, color .15s;
}
.tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
.tab.on { background: var(--panel-2); color: var(--text-hi); box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 2px 8px rgba(0,0,0,0.25); }
.tab .cnt { font: 600 12px/1 var(--mono); padding: 3px 7px; border-radius: 99px; background: rgba(255, 255, 255, 0.07); color: var(--text); }
.tab[data-f="approved"] .cnt { color: var(--ok); background: rgba(111, 207, 115, 0.12); }
.tab[data-f="rejected"] .cnt { color: var(--bad); background: rgba(224, 106, 95, 0.12); }
.tab[data-f="pending"] .cnt { color: var(--accent); background: rgba(201, 166, 255, 0.12); }
.tb-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  padding: 8px 14px; border-radius: 10px; font-size: 14px; line-height: 1.3;
  transition: background .15s, border-color .15s, color .15s, transform .05s;
}
.btn:hover:not(:disabled) { background: var(--panel-2); border-color: rgba(201, 166, 255, 0.3); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; }
.btn.ghost-ok { color: var(--ok); border-color: rgba(111, 207, 115, 0.35); background: rgba(111, 207, 115, 0.06); }
.btn.ghost-ok:hover:not(:disabled) { background: rgba(111, 207, 115, 0.14); border-color: rgba(111, 207, 115, 0.6); }

/* ---------- cards ---------- */
.list { display: grid; gap: 18px; }
.card {
  position: relative; background: linear-gradient(180deg, rgba(255,255,255,0.018), transparent 120px), var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 20px 14px 22px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
  scroll-margin-top: calc(var(--top-offset) + var(--toolbar-h) + 34px);
  scroll-margin-bottom: calc(var(--bar-h) + 20px);
  transition: border-color .2s, box-shadow .2s, outline-color .2s;
  outline: 2px solid transparent; outline-offset: 4px;
}
.card::before {
  content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px; width: 4px; border-radius: 0 4px 4px 0;
  background: var(--muted-2); opacity: .55; transition: background .2s, opacity .2s;
}
.card.focused { outline-color: rgba(201, 166, 255, 0.75); }
.card.is-approve { border-color: rgba(111, 207, 115, 0.75); box-shadow: 0 0 0 1px rgba(111, 207, 115, 0.35) inset, 0 12px 32px rgba(0,0,0,0.28), 0 0 28px rgba(111, 207, 115, 0.10); }
.card.is-approve::before { background: var(--ok); opacity: 1; }
.card.is-reject { border-color: rgba(224, 106, 95, 0.8); box-shadow: 0 0 0 1px rgba(224, 106, 95, 0.35) inset, 0 12px 32px rgba(0,0,0,0.28), 0 0 28px rgba(224, 106, 95, 0.10); }
.card.is-reject::before { background: var(--bad); opacity: 1; }
.card-h { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 12px; min-width: 0; }
.idx { font: 600 12px/1 var(--mono); color: var(--muted-2); }
.badge { font: 700 12px/1 var(--mono); padding: 4px 7px; border-radius: 6px; letter-spacing: .04em; }
.badge.p1 { color: #2a1d05; background: var(--gold); }
.badge.p2 { color: var(--accent-ink); background: var(--accent); }
.badge.p3 { color: var(--text); background: rgba(255, 255, 255, 0.10); }
.card-h h2 { margin: 0; font-size: 18.5px; line-height: 1.35; font-weight: 700; color: var(--text-hi); min-width: 0; overflow-wrap: anywhere; }
.card-h .aid { font: 12.5px/1.2 var(--mono); color: var(--muted); padding: 3px 6px; border-radius: 6px; background: rgba(255,255,255,0.04); overflow-wrap: anywhere; }
.tag { font-size: 12.5px; line-height: 1.2; padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--text); background: rgba(201, 166, 255, 0.06); white-space: nowrap; }
.tag.mode { color: var(--muted); background: transparent; border-color: var(--line-2); white-space: normal; }
.used { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.sp { flex: 1 1 auto; }
.round { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.stamp {
  font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 99px; white-space: nowrap;
  color: var(--muted); border: 1px dashed rgba(154, 143, 168, 0.45);
}
.card.is-approve .stamp { color: var(--ok-ink); background: var(--ok); border: 1px solid var(--ok); }
.card.is-reject .stamp { color: var(--bad-ink); background: var(--bad); border: 1px solid var(--bad); }

.card-b { display: grid; grid-template-columns: minmax(0, 1fr) 424px; gap: 20px; align-items: start; }

/* images */
.imgs { display: grid; gap: 12px; align-items: start; }
.fig { margin: 0; min-width: 0; }
.fig-l { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.fig-l b { color: var(--text); font-weight: 600; }
.fig-l .hint { font-size: 11.5px; color: var(--muted-2); overflow: hidden; text-overflow: ellipsis; }
.fig.pick .fig-l b { color: var(--accent); }
.media {
  position: relative; height: clamp(210px, 19vw, 300px); border-radius: 10px; overflow: hidden;
  background: radial-gradient(circle at 50% 40%, #241e2d, #17131d 75%);
  border: 1px solid var(--line-2); cursor: zoom-in;
  transition: border-color .15s, box-shadow .15s;
}
.media:hover { border-color: rgba(201, 166, 255, 0.45); }
.media.checker { background: var(--checker); }
.media img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block;
  opacity: 0; transition: opacity .25s ease;
}
.media.loaded img { opacity: 1; }
.media .loading {
  position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted-2); font-size: 12.5px;
}
.media.loaded .loading { display: none; }
.media.missing { cursor: default; background: repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 10px, transparent 10px 20px), var(--panel-3); border-style: dashed; }
.media.missing:hover { border-color: var(--line-2); }
.ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px; text-align: center; color: var(--muted); font-size: 13px; }
.ph .ph-i { font-size: 22px; color: var(--muted-2); line-height: 1; }
.ph code { font: 11px/1.4 var(--mono); color: var(--muted-2); overflow-wrap: anywhere; max-width: 100%; }
.media .chosen {
  position: absolute; left: 8px; top: 8px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px;
  background: var(--ok); color: var(--ok-ink); display: none; box-shadow: 0 2px 8px rgba(0,0,0,.35);
}
.fig.selected .media { border-color: var(--ok); box-shadow: 0 0 0 2px rgba(111, 207, 115, 0.55); }
.fig.selected .chosen { display: block; }
.media .zoom {
  position: absolute; right: 8px; bottom: 8px; font-size: 11.5px; padding: 2px 8px; border-radius: 99px;
  background: rgba(10, 8, 14, 0.72); color: var(--text); opacity: 0; transition: opacity .15s;
}
.media.loaded:hover .zoom { opacity: 1; }

/* decision panel */
.decide { display: grid; gap: 12px; min-width: 0; }
.note { border-radius: 10px; background: var(--panel-3); border: 1px solid var(--line-2); padding: 10px 14px 12px; position: relative; }
.note-h { font-size: 12px; color: var(--accent); letter-spacing: .08em; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.note blockquote { margin: 0; padding-left: 12px; border-left: 2px solid rgba(201, 166, 255, 0.45); color: var(--text); font-size: 14px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
.note blockquote.no-note { color: var(--muted-2); font-style: italic; }
.ctl { display: grid; gap: 10px; min-width: 0; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.dbtn {
  flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 11px; border-radius: 10px; font-size: 14.5px; font-weight: 700; line-height: 1.2; white-space: nowrap;
  background: transparent; border: 1.5px solid; transition: background .15s, color .15s, box-shadow .15s, transform .05s;
}
.dbtn kbd { font-size: 10.5px; border-color: currentColor; color: inherit; opacity: .7; background: transparent; }
.dbtn.ok { color: var(--ok); border-color: rgba(111, 207, 115, 0.55); }
.dbtn.ok:hover:not(:disabled) { background: rgba(111, 207, 115, 0.12); border-color: var(--ok); }
.dbtn.ok.on { background: var(--ok); color: var(--ok-ink); border-color: var(--ok); box-shadow: 0 4px 16px rgba(111, 207, 115, 0.25); }
.dbtn.no { color: var(--bad); border-color: rgba(224, 106, 95, 0.55); }
.dbtn.no:hover:not(:disabled) { background: rgba(224, 106, 95, 0.12); border-color: var(--bad); }
.dbtn.no.on { background: var(--bad); color: var(--bad-ink); border-color: var(--bad); box-shadow: 0 4px 16px rgba(224, 106, 95, 0.25); }
.dbtn:active:not(:disabled) { transform: translateY(1px); }
.dbtn:disabled { opacity: .45; }
.dbtn.on:disabled { opacity: .85; }
textarea.cmt {
  width: 100%; min-height: 66px; resize: vertical; padding: 9px 12px; border-radius: 10px;
  background: var(--panel-3); border: 1px solid var(--line-2); color: var(--text); font-size: 14px; line-height: 1.55;
  transition: border-color .15s, box-shadow .15s;
}
textarea.cmt::placeholder { color: var(--muted-2); }
textarea.cmt:focus { outline: none; border-color: rgba(201, 166, 255, 0.6); box-shadow: 0 0 0 3px rgba(201, 166, 255, 0.12); }
.card.is-reject.need-reason textarea.cmt { border-color: rgba(224, 106, 95, 0.55); border-style: dashed; }
.need { display: none; font-size: 12.5px; color: var(--bad); margin-top: -4px; }
.card.is-reject.need-reason .need { display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.025); color: var(--muted);
  padding: 3px 10px; border-radius: 99px; font-size: 12.5px; line-height: 1.5; transition: all .12s;
}
.chip:hover:not(:disabled) { color: var(--text); border-color: rgba(224, 106, 95, 0.5); }
.chip.on { color: #ffd9d4; background: rgba(224, 106, 95, 0.18); border-color: rgba(224, 106, 95, 0.6); }
.chip:disabled { opacity: .5; }
.chip.on::before { content: "✓ "; }

details.prompt { margin-top: 12px; border-top: 1px solid var(--line-2); padding-top: 8px; }
details.prompt summary {
  cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--muted); padding: 2px 4px; border-radius: 6px; user-select: none;
}
details.prompt summary::-webkit-details-marker { display: none; }
details.prompt summary::before { content: "▸"; font-size: 11px; transition: transform .15s; display: inline-block; }
details.prompt[open] summary::before { transform: rotate(90deg); }
details.prompt summary:hover { color: var(--text); }
details.prompt pre {
  margin: 8px 0 2px; padding: 12px 14px; border-radius: 10px; background: var(--bg-deep); border: 1px solid var(--line-2);
  font: 12.5px/1.65 var(--mono); color: #cfc6dc; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto;
}

.nomatch { display: none; text-align: center; padding: 56px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }
.nomatch.show { display: block; }

/* ---------- bottom bar ---------- */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: rgba(26, 22, 33, 0.94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line); box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.35);
}
.bar .wrap { display: flex; align-items: center; gap: 18px; min-height: var(--bar-h); padding-top: 10px; padding-bottom: 10px; }
.tally { display: flex; flex-direction: column; gap: 6px; min-width: 210px; }
.tally-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.tally .big { font-size: 16px; font-weight: 700; color: var(--text-hi); font-variant-numeric: tabular-nums; }
.tally .sub { font-size: 12.5px; color: var(--muted); }
.tally .sub .a { color: var(--ok); } .tally .sub .r { color: var(--bad); }
.seg-track { display: flex; height: 5px; width: 220px; border-radius: 99px; overflow: hidden; background: rgba(255, 255, 255, 0.07); }
.seg-track i { display: block; height: 100%; transition: width .3s; }
.seg-track .a { background: var(--ok); } .seg-track .r { background: var(--bad); }
.warn { font-size: 13px; color: var(--bad); background: rgba(224, 106, 95, 0.10); border: 1px solid rgba(224, 106, 95, 0.3); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.warn[hidden] { display: none; }
.keys { flex: 1 1 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.keys span { white-space: nowrap; }
.submit {
  margin-left: auto; border: 0; border-radius: 12px; padding: 13px 26px; font-size: 16px; font-weight: 800; letter-spacing: .06em;
  color: var(--accent-ink); background: linear-gradient(180deg, #d9bfff, var(--accent));
  box-shadow: 0 6px 22px rgba(201, 166, 255, 0.28), 0 1px 0 rgba(255,255,255,.4) inset; transition: transform .05s, box-shadow .15s, filter .15s;
  white-space: nowrap;
}
.submit:hover:not(:disabled) { filter: brightness(1.06); box-shadow: 0 8px 28px rgba(201, 166, 255, 0.38), 0 1px 0 rgba(255,255,255,.4) inset; }
.submit:active:not(:disabled) { transform: translateY(1px); }
.submit:disabled { filter: grayscale(.6) brightness(.8); opacity: .75; }
.submit.done { background: var(--ok); color: var(--ok-ink); box-shadow: none; }

/* ---------- success banner ---------- */
.banner {
  position: fixed; left: 0; right: 0; top: 0; z-index: 40;
  background: linear-gradient(90deg, #2f6b33, #4fa654 45%, #2f6b33);
  color: #f2fff0; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
}
.banner[hidden] { display: none; }
.banner .wrap { display: flex; align-items: center; gap: 18px; min-height: 84px; padding-top: 12px; padding-bottom: 12px; }
.banner .ck { flex: none; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; font-weight: 900; background: rgba(255, 255, 255, 0.18); }
.banner .t1 { font-size: 22px; font-weight: 800; letter-spacing: .03em; }
.banner .t2 { font-size: 14px; opacity: .9; }
body.submitted .card { opacity: .82; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--bar-h) + 18px); transform: translate(-50%, 12px); z-index: 60;
  background: #2f2839; color: var(--text-hi); border: 1px solid var(--line); padding: 9px 18px; border-radius: 99px;
  font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  max-width: calc(100vw - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- lightbox ---------- */
.lb { position: fixed; inset: 0; z-index: 80; background: rgba(9, 7, 12, 0.94); display: flex; flex-direction: column; cursor: zoom-out; }
.lb[hidden] { display: none; }
.lb-top, .lb-bot { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; flex-wrap: wrap; }
.lb-title { font-size: 16px; font-weight: 700; color: var(--text-hi); overflow-wrap: anywhere; }
.lb-title .k { color: var(--accent); margin-left: 8px; }
.lb-title .n { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 10px; font-variant-numeric: tabular-nums; }
.lb-tools { display: flex; align-items: center; gap: 12px; cursor: default; }
.seg { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(255, 255, 255, 0.06); font-size: 13px; color: var(--muted); }
.seg .lab { padding: 0 8px 0 6px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 11px; border-radius: 8px; font-size: 13px; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--panel-2); color: var(--text-hi); }
.lb-x { border: 1px solid var(--line); background: rgba(255,255,255,0.05); width: 38px; height: 38px; border-radius: 10px; font-size: 18px; color: var(--text); }
.lb-x:hover { background: rgba(255,255,255,0.1); }
.lb-stage { flex: 1 1 auto; position: relative; display: grid; place-items: center; min-height: 0; padding: 0 76px; }
.lb-img { display: block; max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.lb-img.bg-checker { background: var(--checker-lb); }
.lb-img.bg-dark { background: #0c0a10; outline: 1px solid rgba(255,255,255,0.08); }
.lb-img.bg-light { background: #ece7dd; }
.lb-miss { color: var(--muted); font-size: 15px; text-align: center; }
.lb-nav {
  position: absolute; top: 50%; transform: translateY(-50%); width: 52px; height: 84px; border-radius: 12px;
  border: 1px solid var(--line); background: rgba(34, 29, 43, 0.75); color: var(--text-hi); font-size: 34px; line-height: 1; cursor: pointer;
}
.lb-nav:hover:not(:disabled) { background: rgba(60, 50, 75, 0.9); }
.lb-nav:disabled { opacity: .25; cursor: default; }
.lb-nav.prev { left: 14px; } .lb-nav.next { right: 14px; }
.lb-bot code { font: 12px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.lb-bot .h { font-size: 12.5px; color: var(--muted); }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 90; background: rgba(9, 7, 12, 0.78); display: grid; place-items: center; padding: 24px 16px; }
.modal[hidden] { display: none; }
.dlg {
  width: min(680px, 100%); max-height: calc(100vh - 48px); overflow: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; padding: 24px 26px 20px; box-shadow: 0 30px 80px rgba(0,0,0,.6);
}
.dlg h3 { margin: 0 0 12px; font-size: 21px; color: var(--text-hi); }
.dlg .fail { background: rgba(224, 106, 95, 0.12); border: 1px solid rgba(224, 106, 95, 0.4); color: #f2b8b1; padding: 9px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
.dlg .fail[hidden] { display: none; }
.dlg ul.st { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 4px; font-size: 14.5px; }
.dlg ul.st li::before { content: "✓"; color: var(--ok); font-weight: 800; margin-right: 8px; }
.dlg ul.st li.no::before { content: "!"; color: var(--gold); }
.dlg .how { background: rgba(201, 166, 255, 0.08); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 15.5px; line-height: 1.7; color: var(--text-hi); }
.dlg .how b { color: var(--accent); }
.dlg textarea { width: 100%; height: 150px; margin-top: 12px; resize: vertical; background: var(--bg-deep); border: 1px solid var(--line-2); border-radius: 10px; color: #cfc6dc; font: 12px/1.5 var(--mono); padding: 10px 12px; }
.dlg .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.pri:hover:not(:disabled) { background: #d6baff; border-color: #d6baff; }

/* ---------- empty state ---------- */
.empty-state { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 16px; }
.empty-state .glyph { font-size: 54px; color: var(--accent); opacity: .85; line-height: 1; margin-bottom: 18px; text-shadow: 0 0 30px rgba(201,166,255,.45); }
.empty-state h2 { margin: 0 0 10px; font-size: 26px; color: var(--text-hi); letter-spacing: .05em; }
.empty-state p { margin: 0 auto; max-width: 520px; color: var(--muted); font-size: 15px; }

/* ---------- responsive ---------- */
@media (max-width: 1280px) {
  .card-b { grid-template-columns: minmax(0, 1fr); }
  .decide { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: start; gap: 16px; }
  .media { height: clamp(200px, 24vw, 280px); }
  .keys { display: none; }
}
@media (max-width: 1060px) {
  .wrap { padding: 0 16px; }
  .card { padding: 14px 14px 12px 16px; }
  h1 { font-size: 25px; }
  .prog { min-width: 0; flex: 1 1 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; }
  .hdr { padding-top: 22px; }
  .intro { margin-top: 16px; }
  .seg-track { width: 160px; }
  .fig-l .hint { display: none; }
  .tally { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; }
}
</style>

<body>
<div id="banner" class="banner" hidden role="status" aria-live="polite">
  <div class="wrap">
    <div class="ck">✓</div>
    <div>
      <div class="t1">已提交 ✓ 回到 Claude 即可，它会自动继续</div>
      <div class="t2" id="bannerSub"></div>
    </div>
  </div>
</div>

<div id="app"></div>

<div id="lb" class="lb" hidden role="dialog" aria-modal="true" aria-label="查看大图">
  <div class="lb-top">
    <div class="lb-title"><span id="lbTitle"></span><span class="k" id="lbKind"></span><span class="n" id="lbCount"></span></div>
    <div class="lb-tools">
      <div class="seg" id="lbBg" role="group" aria-label="背景">
        <span class="lab">背景</span>
        <button type="button" data-bg="checker">棋盘格</button>
        <button type="button" data-bg="dark">深色</button>
        <button type="button" data-bg="light">浅色</button>
      </div>
      <button type="button" class="lb-x" id="lbClose" title="关闭 (Esc)" aria-label="关闭">✕</button>
    </div>
  </div>
  <div class="lb-stage" id="lbStage">
    <button type="button" class="lb-nav prev" id="lbPrev" title="上一张 (←)" aria-label="上一张">‹</button>
    <img class="lb-img bg-checker" id="lbImg" alt="">
    <div class="lb-miss" id="lbMiss" hidden>这张图没找到</div>
    <button type="button" class="lb-nav next" id="lbNext" title="下一张 (→)" aria-label="下一张">›</button>
  </div>
  <div class="lb-bot">
    <code id="lbPath"></code>
    <span class="h"><kbd>←</kbd> <kbd>→</kbd> 切换 · <kbd>G</kbd> 换背景 · <kbd>Esc</kbd> 或点击空白处关闭</span>
  </div>
</div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="dlg">
    <h3 id="mTitle">复审结果已保存</h3>
    <div class="fail" id="mFail" hidden></div>
    <ul class="st">
      <li id="mDl">已下载：复审结果.json</li>
      <li id="mClip">已复制到剪贴板</li>
    </ul>
    <div class="how">把下载的 <b>复审结果.json</b> 放进 <b>美术资产</b> 文件夹，然后告诉 Claude『复审好了』（或者直接把复制的内容粘贴给 Claude）</div>
    <textarea id="mJson" readonly spellcheck="false" aria-label="复审结果内容"></textarea>
    <div class="acts">
      <button type="button" class="btn" id="mCopy">复制内容</button>
      <button type="button" class="btn" id="mDown">再下载一次</button>
      <button type="button" class="btn pri" id="mOk">知道了</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const REVIEW = /*__REVIEW_DATA__*/null;

(function () {
  var CAT = { body: '骨架', part: '部件', background: '背景', icon: '图标', ui: '界面', boss: 'Boss', card_art: '卡图' };
  var CHIPS = ['太写实', '颜色不对/不是灰度', '形状不像', '太复杂', '太简单', '方向反了', '有多余的东西', '风格和其他图不统一', '主体太小'];
  var KIND_CN = { pick: '推荐', alt: '备选', processed: '游戏内处理后', screen: '试装截图' };
  var SEP_RE = /[，,；;、\n]+/;

  var $ = function (id) { return document.getElementById(id); };
  var app = $('app');

  /* ---------- tiny DOM helper (text only, never innerHTML) ---------- */
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') n.className = v;
        else if (k === 'text') n.textContent = String(v);
        else if (k === 'style') n.setAttribute('style', v);
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v === true ? '' : String(v));
      });
    }
    if (kids !== undefined && kids !== null) {
      [].concat(kids).forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        n.append(c instanceof Node ? c : document.createTextNode(String(c)));
      });
    }
    return n;
  }
  function str(v) { return (v === null || v === undefined) ? '' : String(v); }
  function assetUrl(p) {
    p = str(p).trim().replace(/\\/g, '/');
    if (!p) return '';
    return p.split('/').map(function (seg) { return encodeURIComponent(seg); }).join('/');
  }
  function num(v, d) { var n = Number(v); return isFinite(n) ? n : d; }
  function pct(a, b) { return b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0; }

  var toastTimer = 0;
  function toast(msg, ms) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, ms || 2200);
  }

  /* ---------- empty state ---------- */
  var data = (REVIEW && typeof REVIEW === 'object') ? REVIEW : null;
  var rawItems = data && Array.isArray(data.items) ? data.items : [];
  var items = [];
  var seen = {};
  rawItems.forEach(function (it) {
    if (!it || typeof it !== 'object') return;
    var id = str(it.id).trim();
    if (!id || seen[id]) return;
    seen[id] = true;
    items.push(it);
  });

  if (!data) {
    renderEmpty('还没有待复审的图', 'Claude 生成并初审完一批图之后，会把它推荐的图放到这里给你看。现在可以先回到 Claude。');
    return;
  }

  var batch = str(data.batch !== undefined && data.batch !== null ? data.batch : '0');
  // token = this workspace's id: two workspaces (or a reset studio) at the same batch number never share decisions
  var STORE_KEY = 'chimera-review-' + str(data.token || '') + '-' + batch;
  var screens = (data.screens && typeof data.screens === 'object') ? data.screens : {};
  document.title = '美术复审 · 第 ' + batch + ' 批 · 奇美拉纪元';

  /* ---------- state ---------- */
  var dec = {};
  items.forEach(function (it) { dec[str(it.id)] = { decision: null, choice: 'pick', comment: '' }; });
  var S = { filter: 'all', focus: null, submitted: false, busy: false, scrollAt: 0 };
  var cards = {};      // id -> refs
  var order = [];      // ids in display order
  var failed = {};     // url -> true

  function hasAlt(it) { return !!str(it.alt).trim(); }

  /* ---------- storage (optional) ---------- */
  function loadStore() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return 0;
      var o = JSON.parse(raw);
      var src = o && o.items && typeof o.items === 'object' ? o.items : null;
      if (!src) return 0;
      var n = 0;
      items.forEach(function (it) {
        var id = str(it.id), s = src[id];
        if (!s || typeof s !== 'object') return;
        if (typeof s.pick === 'string' && s.pick !== str(it.pick)) return;  // decided on an older candidate
        var d = dec[id];
        if (s.decision === 'approve' || s.decision === 'reject') { d.decision = s.decision; n++; }
        d.choice = (s.choice === 'alt' && hasAlt(it)) ? 'alt' : 'pick';
        d.comment = typeof s.comment === 'string' ? s.comment : '';
      });
      return n;
    } catch (e) { return 0; }
  }
  function saveStore() {
    try {
      var out = {};
      Object.keys(dec).forEach(function (id) {
        var d = dec[id];
        if (d.decision || d.comment) out[id] = { decision: d.decision, choice: d.choice, comment: d.comment, pick: cards[id] ? str(cards[id].it.pick) : '' };
      });
      window.localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, saved: new Date().toISOString(), submitted: S.submitted || undefined, items: out }));
    } catch (e) { /* storage unavailable: page still works */ }
  }

  /* ---------- header ---------- */
  function renderHeader() {
    var p = (data.progress && typeof data.progress === 'object') ? data.progress : null;
    var spent = num(data.spent_usd, NaN);
    var meta = el('div', { class: 'meta' }, [
      data.generated ? el('span', null, ['生成于 ', el('b', { text: str(data.generated) })]) : null,
      data.model ? el('span', null, ['模型 ', el('b', { text: str(data.model) })]) : null,
      isFinite(spent) ? el('span', { class: 'money' }, ['已花费 ', el('b', { text: '$' + spent.toFixed(2) })]) : null,
      el('span', null, ['本批 ', el('b', { text: String(items.length) }), ' 张'])
    ]);
    var prog = null;
    if (p) {
      var rows = [];
      var a = num(p.approved, 0), t = num(p.total, 0), a1 = num(p.p1_approved, 0), t1 = num(p.p1_total, 0);
      if (t > 0) rows.push(progRow('总进度', a, t, ''));
      if (t1 > 0) rows.push(progRow('P1 必需', a1, t1, 'p1'));
      if (rows.length) prog = el('div', { class: 'prog', title: '整个游戏的美术资产已通过数量' }, rows);
    }
    return el('header', { class: 'hdr wrap' }, [
      el('div', { class: 'hdr-row' }, [
        el('div', null, [
          el('div', { class: 'brand' }, [el('b', { text: '奇美拉纪元' }), ' · 美术工坊']),
          el('h1', null, ['美术复审', el('span', { class: 'dot', text: '·' }), '第 ', el('span', { class: 'num', text: batch }), ' 批']),
          meta
        ]),
        prog
      ]),
      el('div', { class: 'intro' }, [
        el('span', { class: 'ic', text: '✦' }),
        el('span', { text: 'Claude 已经先审过一轮，每张资产只给你看它推荐的图。点「通过」或「不要」，不要的话写一句原因，最后点「提交」。' })
      ])
    ]);
  }
  function progRow(label, a, t, cls) {
    return el('div', { class: 'prog-row' }, [
      el('span', { text: label }),
      el('div', { class: 'track' }, el('div', { class: 'fill ' + cls, style: 'width:' + pct(a, t).toFixed(1) + '%' })),
      el('span', { class: 'nums' }, [a + ' / ' + t, el('small', { text: '已通过' })])
    ]);
  }

  /* ---------- toolbar ---------- */
  var tabEls = {};
  var bulkBtn;
  function renderToolbar() {
    var defs = [['all', '全部'], ['pending', '未决定'], ['approved', '通过'], ['rejected', '不要']];
    var tabs = el('div', { class: 'tabs', role: 'tablist' }, defs.map(function (d) {
      var cnt = el('span', { class: 'cnt', text: '0' });
      var b = el('button', { type: 'button', class: 'tab' + (d[0] === S.filter ? ' on' : ''), role: 'tab', 'data-f': d[0],
        onclick: function () { setFilter(d[0]); } }, [d[1], cnt]);
      tabEls[d[0]] = { btn: b, cnt: cnt };
      return b;
    }));
    bulkBtn = el('button', { type: 'button', class: 'btn ghost-ok', id: 'bulkApprove', onclick: bulkApprove, text: '剩下的全部通过（用推荐图）' });
    return el('div', { class: 'toolbar' }, el('div', { class: 'wrap' }, [tabs, el('div', { class: 'tb-right' }, [bulkBtn])]));
  }

  /* ---------- card ---------- */
  function placeholder(icon, text, path) {
    return el('div', { class: 'ph' }, [el('span', { class: 'ph-i', text: icon }), el('span', { text: text }), path ? el('code', { text: path }) : null]);
  }
  function makeMedia(id, kind, path, checker) {
    var box = el('div', { class: 'media' + (checker ? ' checker' : '') });
    var url = assetUrl(path);
    if (!url) {
      box.classList.add('missing');
      var t = kind === 'processed' ? '还没有处理后的预览' : kind === 'screen' ? '暂无试装截图' : '图片缺失';
      box.append(placeholder('◌', t, ''));
      return box;
    }
    box.append(el('div', { class: 'loading', text: '加载中…' }));
    var img = document.createElement('img');
    img.alt = KIND_CN[kind] || '';
    img.decoding = 'async';
    img.draggable = false;
    img.addEventListener('load', function () { box.classList.add('loaded'); });
    img.addEventListener('error', function () {
      failed[url] = true;
      box.classList.add('missing');
      box.classList.remove('loaded');
      img.remove();
      var ld = box.querySelector('.loading'); if (ld) ld.remove();
      box.append(placeholder('?', '图片没找到', str(path)));
    });
    img.src = url;
    box.append(img);
    box.append(el('span', { class: 'chosen', text: '✓ 已选' }));
    box.append(el('span', { class: 'zoom', text: '点击放大' }));
    box.addEventListener('click', function () {
      if (box.classList.contains('missing')) return;
      setFocus(id, false);
      openLightbox(id, kind);
    });
    return box;
  }
  function figure(id, kind, path, label, hint, checker) {
    var f = el('figure', { class: 'fig ' + kind, 'data-kind': kind }, [
      el('div', { class: 'fig-l' }, [el('b', { text: label }), hint ? el('span', { class: 'hint', text: hint }) : null]),
      makeMedia(id, kind, path, checker)
    ]);
    return f;
  }

  function imageList(it) {
    var list = [];
    function add(kind, path) {
      var u = assetUrl(path);
      if (u && !failed[u]) list.push({ kind: kind, path: str(path), url: u });
    }
    add('pick', it.pick);
    if (hasAlt(it)) add('alt', it.alt);
    add('processed', it.processed);
    add('screen', screenPath(it));
    return list;
  }
  function screenPath(it) {
    var k = str(it.screen).trim();
    if (!k) return '';
    return str(screens[k]);
  }

  function renderCard(it, i) {
    var id = str(it.id);
    var pr = Math.max(1, Math.min(3, Math.round(num(it.priority, 3))));
    var cat = str(it.category);
    var alt = hasAlt(it);
    var refs = { id: id, it: it };

    var used = Array.isArray(it.used_by) ? it.used_by.map(str).filter(Boolean) : [];
    var round = num(it.round, 0);
    var stamp = el('span', { class: 'stamp', text: '未决定' });
    var head = el('div', { class: 'card-h' }, [
      el('span', { class: 'idx', text: String(i + 1).padStart(2, '0') }),
      el('span', { class: 'badge p' + pr, text: 'P' + pr, title: pr === 1 ? '优先级 1：游戏必需' : '优先级 ' + pr }),
      el('h2', { text: str(it.cn) || id }),
      el('code', { class: 'aid', text: id }),
      cat ? el('span', { class: 'tag', text: CAT[cat] || cat }) : null,
      str(it.mode_cn) ? el('span', { class: 'tag mode', text: str(it.mode_cn) }) : null,
      used.length ? el('span', { class: 'used', text: '用于：' + used.join('、') }) : null,
      el('span', { class: 'sp' }),
      round > 0 ? el('span', { class: 'round', text: '第 ' + round + ' 轮生成' }) : null,
      stamp
    ]);
    refs.stamp = stamp;

    // images
    var figs = [];
    var cols = [];
    var wide = cat === 'background' || cat === 'card_art' || cat === 'ui';
    refs.figPick = figure(id, 'pick', it.pick, '推荐', 'Claude 选的', false);
    figs.push(refs.figPick); cols.push(wide ? 1.7 : 1.35);
    if (alt) { refs.figAlt = figure(id, 'alt', it.alt, '备选', '', false); figs.push(refs.figAlt); cols.push(1); }
    figs.push(figure(id, 'processed', it.processed, '游戏内处理后', '棋盘格 = 透明', true)); cols.push(1);
    figs.push(figure(id, 'screen', screenPath(it), '试装截图', '', false)); cols.push(1.25);
    var imgs = el('div', { class: 'imgs', style: 'grid-template-columns:' + cols.map(function (c) { return 'minmax(0,' + c + 'fr)'; }).join(' ') }, figs);

    // decision
    var note = str(it.note).trim();
    var noteBox = el('div', { class: 'note' }, [
      el('div', { class: 'note-h', text: '❝ Claude 的推荐理由' }),
      el('blockquote', { class: note ? null : 'no-note', text: note || 'Claude 没有留下说明。' })
    ]);
    var btns = [];
    refs.btnPick = el('button', { type: 'button', class: 'dbtn ok', 'data-act': 'pick', onclick: function () { clickDecide(id, 'approve', 'pick'); } },
      [alt ? '✓ 通过·用推荐' : '✓ 通过', el('kbd', { text: 'A' })]);
    btns.push(refs.btnPick);
    if (alt) {
      refs.btnAlt = el('button', { type: 'button', class: 'dbtn ok', 'data-act': 'alt', onclick: function () { clickDecide(id, 'approve', 'alt'); } },
        ['✓ 通过·用备选', el('kbd', { text: 'B' })]);
      btns.push(refs.btnAlt);
    }
    refs.btnReject = el('button', { type: 'button', class: 'dbtn no', 'data-act': 'reject', onclick: function () { clickDecide(id, 'reject'); } },
      ['✗ 不要', el('kbd', { text: 'X' })]);

  function renderBar() {
    barRefs.big = el('span', { class: 'big' });
    barRefs.a = el('span', { class: 'a' });
    barRefs.r = el('span', { class: 'r' });
    barRefs.u = el('span', { class: 'u' });
    barRefs.segA = el('i', { class: 'a' });
    barRefs.segR = el('i', { class: 'r' });
    barRefs.warn = el('span', { class: 'warn', hidden: true });
    barRefs.submit = el('button', { type: 'button', class: 'submit', id: 'submitBtn', onclick: submit, text: '提交复审结果' });
    function key(k, label) { return el('span', null, [].concat(k.map(function (x) { return el('kbd', { text: x }); }), [' ' + label])); }
    return el('div', { class: 'bar' }, el('div', { class: 'wrap' }, [
      el('div', { class: 'tally' }, [
        el('div', { class: 'tally-top' }, [barRefs.big, el('span', { class: 'sub' }, [barRefs.a, ' · ', barRefs.r, ' · ', barRefs.u])]),
        el('div', { class: 'seg-track' }, [barRefs.segA, barRefs.segR])
      ]),
      barRefs.warn,
      el('div', { class: 'keys' }, [
        key(['J', 'K'], '上下切换'), key(['A'], '通过'), key(['B'], '用备选'), key(['X'], '不要'), key(['/'], '写原因'), el('span', { text: '点图放大' })
      ]),
      barRefs.submit
    ]));
  }

  /* ---------- empty ---------- */
  function renderEmpty(title, sub) {
    document.body.classList.add('is-empty');
    app.append(el('div', { class: 'empty-state' }, el('div', null, [
      el('div', { class: 'glyph', text: '✦' }),
      el('h2', { text: title }),
      el('p', { text: sub })
    ])));
  }

  /* ---------- boot ---------- */
  app.append(renderHeader());
  if (!items.length) {
    renderEmpty('这一批没有需要你复审的图', 'Claude 这一轮没有挑出要给你看的图。回到 Claude 继续就好。');
    return;
  }
  var restored = loadStore();
  app.append(renderToolbar());
  var list = el('main', { class: 'list wrap' }, items.map(renderCard));
  nomatch = el('div', { class: 'nomatch' });
  list.append(nomatch);
  app.append(list);
  app.append(renderBar());
  order.forEach(updateCard);
  updateCounts();
  setFilter('all');
  if (restored) toast('已恢复上次的选择（' + restored + ' 张）', 2600);
})();
</script>
</body>
</html>
